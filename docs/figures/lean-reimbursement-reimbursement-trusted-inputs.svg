<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. Assumed evidence and executed checks</title>
<desc id="desc">Policy authentication and semantic review are outside the existing model. The figure makes that boundary explicit rather than suggesting that identifier equality authenticates a contract. [11]</desc>
<rect width="960" height="100%" rx="12" fill="#111e1b"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{fill:#f4f2ec;font-size:19px;font-weight:600}.detail{fill:#b5c4bc;font-size:16px}.num{fill:#ff8a62;font-size:14px;font-weight:700}</style>
<rect x="26" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="49">01</text>
<text class="label" x="78" y="50">External authority</text>
<text class="detail" x="44" y="84">Contract documents, coverage decisions, reviewer</text>
<text class="detail" x="44" y="104">identities, and benefit records.</text>
<path d="M 469 80 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="49">02</text>
<text class="label" x="550" y="50">Selected Policy and Claim</text>
<text class="detail" x="516" y="84">Caller supplies parameters and reviewed facts;</text>
<text class="detail" x="516" y="104">authenticity is an upstream assumption.</text>
<rect x="26" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="191">03</text>
<text class="label" x="78" y="192">Lean eligibility gate</text>
<text class="detail" x="44" y="226">Checks agreement, applicability, represented</text>
<text class="detail" x="44" y="246">status, units, and calendar dates.</text>
<path d="M 469 222 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="191">04</text>
<text class="label" x="550" y="192">Synthetic Quote</text>
<text class="detail" x="516" y="226">Applies exact toy arithmetic only through the</text>
<text class="detail" x="516" y="246">guarded adjudicate function.</text>
