<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">Figure 3. Proposed real-policy validation protocol</title>
<desc id="desc">Every stage is proposed future work. No real-policy comparator, claims cohort, payment action, or empirical agreement rate is reported in this release. [2,5,9,11,12]</desc>
<rect width="960" height="100%" rx="12" fill="#111e1b"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{fill:#f4f2ec;font-size:19px;font-weight:600}.detail{fill:#b5c4bc;font-size:16px}.num{fill:#ff8a62;font-size:14px;font-weight:700}</style>
<rect x="26" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="49">01</text>
<text class="label" x="78" y="50">Freeze one policy slice</text>
<text class="detail" x="44" y="84">Rights, source digests, effective dates, service</text>
<text class="detail" x="44" y="104">family, setting, and benefit snapshot.</text>
<path d="M 469 80 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="49">02</text>
<text class="label" x="550" y="50">Independent translations</text>
<text class="detail" x="516" y="84">Reviewed specification, Lean model, and</text>
<text class="detail" x="516" y="104">separately authored ordinary reference.</text>
<rect x="26" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="191">03</text>
<text class="label" x="78" y="192">Boundary and replay tests</text>
<text class="detail" x="44" y="226">Status mutations, exact cents, duplicates,</text>
<text class="detail" x="44" y="246">corrections, and later stateful scenarios.</text>
<path d="M 469 222 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="191">04</text>
<text class="label" x="550" y="192">Disagreement accounting</text>
<text class="detail" x="516" y="226">Policy error, missing evidence, arithmetic</text>
<text class="detail" x="516" y="246">difference, abstention, and review cost.</text>
</svg>
